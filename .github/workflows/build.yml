name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: ao3-reader-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      # Each push to main becomes a release the app's "Check for updates" can install.
      - name: Publish release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$((GITHUB_RUN_NUMBER + 100))
          cp app/build/outputs/apk/debug/app-debug.apk ao3-reader.apk
          gh release create "build-$code" ao3-reader.apk \
            --title "Build $code" \
            --notes "$(git log -1 --pretty=%B)" \
            --target "$GITHUB_SHA"
